server {
    listen 443 ssl;
    http2 on;
    server_name hhy-api.orbexa.cc hhy-ws.orbexa.cc;

    ssl_certificate /www/server/panel/vhost/cert/hhy.orbexa.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/hhy.orbexa.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:18192;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hhy-admin.orbexa.cc;

    ssl_certificate /www/server/panel/vhost/cert/hhy.orbexa.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/hhy.orbexa.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Admin deliberately renders the D02 reference state in a same-origin
    # iframe; SAMEORIGIN blocks cross-site framing without blanking that UI.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:18190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

